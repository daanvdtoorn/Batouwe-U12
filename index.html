<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basketbal Rotatie Schema</title>
    <style>
      :root {
        --bg: #111827;
        --panel: #1f2937;
        --panel-2: #0f172a;
        --tile: #e5e7eb;
        --line: rgba(255,255,255,0.1);
        --text: #f3f4f6;
        --muted: #cbd5e1;
        --red: #b7191f;
        --red-dark: #8b1117;
        --dribbler: #f59e0b;
        --inbounder: #3b82f6;
        --runner: #10b981;
        --ok: #34d399;
        --warn: #fbbf24;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        padding: 18px;
      }

      .page-shell {
        max-width: 1400px;
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        background: rgba(17,24,39,0.9);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px 20px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 2vw, 2.8rem);
        color: #f8fafc;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .primary {
        background: var(--red);
        color: white;
      }

      .secondary {
        background: #374151;
        color: var(--text);
      }

      .players-panel, .schedule-panel, .match-panel {
        background: rgba(31,41,55,0.9);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px;
        margin-bottom: 22px;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }

      .panel-header h2 {
        margin: 0;
        font-size: 1.1rem;
        color: white;
      }

      .panel-controls {
        display: flex;
        gap: 10px;
        align-items: center;
      }

      .summary-pill {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 12px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .collapse-btn {
        background: transparent;
        border: 1px solid var(--line);
        color: var(--text);
        padding: 6px 10px;
        font-size: 1rem;
        cursor: pointer;
        border-radius: 8px;
      }

      .collapse-btn:hover {
        background: rgba(255,255,255,0.1);
      }

      .panel-content {
        max-height: 2000px;
        overflow: hidden;
        transition: max-height 0.3s ease;
      }

      .panel-content.collapsed {
        max-height: 0;
        overflow: hidden;
      }

      .players-layout {
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 24px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      thead th {
        background: rgba(255,255,255,0.04);
        color: var(--muted);
        padding: 10px 8px;
        border-bottom: 1px solid var(--line);
        text-align: center;
      }

      thead th:nth-child(2) { text-align: left; }

      tbody td {
        padding: 8px 8px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        text-align: center;
      }

      tbody td:nth-child(2) { text-align: left; }

      input[type="text"], input[type="number"], input[type="date"], select {
        width: 100%;
        background: #0f172a;
        color: white;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
      }

      input[type="checkbox"] {
        accent-color: var(--red);
        width: 18px;
        height: 18px;
      }

      .rotation-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      .stat-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 10px;
        color: var(--text);
        font-size: 0.82rem;
      }

      .stat-pill .count {
        min-width: 36px;
        text-align: center;
        padding: 3px 7px;
        border-radius: 999px;
        background: var(--red);
        color: white;
        font-weight: bold;
      }

      .schedule-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .period-card {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }

      .period-card.invalid {
        border-color: rgba(251, 191, 36, 0.8);
      }

      .period-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .period-head h3 {
        margin: 0;
        font-size: 1rem;
      }

      .slot-row {
        display: grid;
        grid-template-columns: 1fr 38px;
        gap: 8px;
        margin-bottom: 8px;
      }

      .slot-row select {
        background: rgba(255,255,255,0.04);
        color: white;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
      }

      .slot-toggle {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255,255,255,0.04);
        color: white;
        font-size: 1rem;
        width: 38px;
        height: 38px;
      }

      .slot-toggle.active {
        background: var(--red);
        border-color: var(--red);
      }

      .slot-name {
        font-size: 0.72rem;
        color: var(--muted);
        padding: 2px 6px 8px 6px;
        min-height: 20px;
      }

      .badge-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      .role-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 32px;
        padding: 5px 8px;
        border-radius: 999px;
        color: white;
        font-size: 0.72rem;
        font-weight: 700;
        cursor: pointer;
      }

      .role-badge:hover {
        opacity: 0.8;
      }

      .role-badge.dribbler { background: var(--dribbler); }
      .role-badge.inbounder { background: var(--inbounder); }
      .role-badge.runner { background: var(--runner); }
      .role-badge.neutral { background: #6b7280; }

      .status {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .status.ok { color: var(--ok); }
      .status.warn { color: var(--warn); }

      .match-form, .template-form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 12px;
        align-items: end;
        margin-bottom: 18px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .form-group label {
        font-size: 0.84rem;
        color: var(--muted);
      }

      .match-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
      }

      .match-card {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        border-left: 6px solid var(--red);
        border-radius: 12px;
        padding: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .match-info h3 {
        margin: 0 0 4px;
      }

      .match-info p {
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .match-actions {
        display: flex;
        gap: 8px;
      }

      .match-actions button {
        padding: 6px 10px;
        font-size: 0.8rem;
      }

      .template-shelf {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        width: 100%;
      }

      .template-shelf .template-name {
        flex: 1 1 180px;
      }

      .template-shelf .template-actions {
        display: flex;
        gap: 8px;
      }

      .modal {
        display: none;
        position: fixed;
        z-index: 1000;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        background-color: rgba(0,0,0,0.7);
        animation: fadeIn 0.3s ease;
      }

      .modal.show {
        display: flex;
        align-items: center;
        justify-content: center;
      }

      @keyframes fadeIn {
        from { opacity: 0; }
        to { opacity: 1; }
      }

      .modal-content {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 24px;
        max-width: 500px;
        width: 90%;
        max-height: 80vh;
        overflow-y: auto;
      }

      .modal-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 20px;
      }

      .modal-header h2 {
        margin: 0;
      }

      .close-btn {
        background: transparent;
        border: none;
        color: var(--text);
        font-size: 28px;
        cursor: pointer;
      }

      .modal-form {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }

      .modal-form-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .modal-form-group label {
        color: var(--muted);
        font-size: 0.9rem;
        font-weight: 600;
      }

      .modal-form-group input,
      .modal-form-group select {
        background: #0f172a;
        color: white;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 10px;
        font: inherit;
      }

      .role-checkboxes {
        display: flex;
        gap: 20px;
        margin-top: 8px;
        flex-wrap: wrap;
      }

      .role-checkboxes label {
        display: flex;
        align-items: center;
        gap: 8px;
        color: var(--text);
        cursor: pointer;
        font-weight: normal;
      }

      .modal-buttons {
        display: flex;
        gap: 12px;
        margin-top: 20px;
      }

      .modal-buttons button {
        flex: 1;
      }

      @media (max-width: 900px) {
        .players-layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 700px) {
        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }
        .actions {
          width: 100%;
        }
        .actions button {
          flex: 1 1 140px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <h1>Basketbal Rotatie Schema</h1>
        <div class="actions">
          <button class="primary" id="generateBtn">Genereer</button>
          <button class="secondary" id="resetBtn">Reset</button>
          <button class="secondary" id="printBtn">Print</button>
        </div>
      </header>

      <section class="match-panel">
        <div class="panel-header">
          <h2>Wedstrijden</h2>
          <button class="collapse-btn" data-panel="match">−</button>
        </div>

        <div class="panel-content" id="matchPanel">
          <div class="match-form">
            <div class="form-group">
              <label>Datum</label>
              <input type="date" id="matchDate" />
            </div>
            <div class="form-group">
              <label>Tegenstander</label>
              <input type="text" id="matchOpponent" placeholder="Tegenstander" />
            </div>
            <button class="primary" id="addMatchBtn">Toevoegen</button>
          </div>

          <div class="template-form">
            <div class="form-group">
              <label>Template naam</label>
              <input type="text" id="templateName" placeholder="Bijv. Vitesse 1" />
            </div>

            <button class="secondary" id="saveTemplateBtn">Bewaar template</button>

            <div class="form-group">
              <label>Template shelf</label>
              <div class="template-shelf">
                <div class="template-name">
                  <select id="templateSelect">
                    <option value="">Geen template</option>
                  </select>
                </div>
                <div class="template-actions">
                  <button class="secondary" id="loadTemplateBtn">Laad</button>
                  <button class="secondary" id="deleteTemplateBtn">Verwijder</button>
                </div>
              </div>
            </div>
          </div>

          <div class="match-grid" id="matchGrid"></div>
        </div>
      </section>

      <section class="players-panel">
        <div class="panel-header">
          <div><h2>Spelers</h2></div>
          <div class="panel-controls">
            <div class="summary-pill" id="presenceSummary">0 spelers aanwezig</div>
            <button class="primary" id="addPlayerBtn" style="padding: 6px 12px; font-size: 0.9rem;">+ Speler</button>
            <button class="collapse-btn" data-panel="players">−</button>
          </div>
        </div>

        <div class="panel-content" id="playersPanel">
          <div class="players-layout">
            <div>
              <table>
                <thead>
                  <tr>
                    <th>Speelt</th>
                    <th>Naam</th>
                    <th>Nr.</th>
                    <th>D</th>
                    <th>I</th>
                    <th>R</th>
                  </tr>
                </thead>
                <tbody id="playersBody"></tbody>
              </table>
            </div>

            <div>
              <div class="rotation-summary" id="rotationSummary"></div>
            </div>
          </div>
        </div>
      </section>

      <section class="schedule-panel">
        <div class="panel-header">
          <h2>Roulatieschema</h2>
          <button class="collapse-btn" data-panel="schedule">−</button>
        </div>
        <div class="panel-content" id="schedulePanel">
          <div class="schedule-grid" id="scheduleGrid"></div>
        </div>
      </section>
    </div>

    <div class="modal" id="playerModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="modalTitle">Speler Toevoegen</h2>
          <button class="close-btn" id="closeModalBtn">&times;</button>
        </div>

        <form class="modal-form" id="playerForm">
          <div class="modal-form-group">
            <label for="playerNameInput">Naam *</label>
            <input type="text" id="playerNameInput" placeholder="Naam" required />
          </div>

          <div class="modal-form-group">
            <label for="playerNumberInput">Rugnummer</label>
            <input type="number" id="playerNumberInput" placeholder="0" min="0" max="99" />
          </div>

          <div class="modal-form-group">
            <label>Rollen</label>
            <div class="role-checkboxes">
              <label>
                <input type="checkbox" id="roleDribbler" />
                Dribbler (D)
              </label>
              <label>
                <input type="checkbox" id="roleInbounder" />
                Inbounder (I)
              </label>
              <label>
                <input type="checkbox" id="roleRunner" />
                Runner (R)
              </label>
            </div>
          </div>

          <div class="modal-buttons">
            <button type="submit" class="primary">Opslaan</button>
            <button type="button" class="secondary" id="cancelBtn">Annuleren</button>
          </div>
        </form>
      </div>
    </div>

    <div class="modal" id="roleModal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 id="roleModalTitle">Rollen aanpassen</h2>
          <button class="close-btn" id="closeRoleModalBtn">&times;</button>
        </div>

        <form class="modal-form" id="roleForm">
          <div class="modal-form-group">
            <label>Rollen voor <strong id="rolePlayerName">speler</strong></label>
            <div class="role-checkboxes">
              <label>
                <input type="checkbox" id="schemaRoleDribbler" />
                Dribbler (D)
              </label>
              <label>
                <input type="checkbox" id="schemaRoleInbounder" />
                Inbounder (I)
              </label>
              <label>
                <input type="checkbox" id="schemaRoleRunner" />
                Runner (R)
              </label>
            </div>
          </div>

          <div class="modal-buttons">
            <button type="submit" class="primary">Opslaan</button>
            <button type="button" class="secondary" id="cancelRoleBtn">Annuleren</button>
          </div>
        </form>
      </div>
    </div>

    <script>
      const basePlayers = [
        { id: "guus", name: "Guus", number: 10, present: true, roles: { dribbler: false, inbounder: false, runner: true } },
        { id: "tanne", name: "Tanne", number: 16, present: true, roles: { dribbler: false, inbounder: true, runner: false } },
        { id: "noah", name: "Noah", number: 30, present: true, roles: { dribbler: true, inbounder: false, runner: false } },
        { id: "vuk", name: "Vuk", number: 55, present: true, roles: { dribbler: false, inbounder: true, runner: false } },
        { id: "sander", name: "Sander", number: 27, present: true, roles: { dribbler: true, inbounder: false, runner: false } },
        { id: "duuk", name: "Duuk", number: 13, present: true, roles: { dribbler: false, inbounder: false, runner: true } },
        { id: "tygo", name: "Tygo", number: 14, present: true, roles: { dribbler: true, inbounder: false, runner: false } },
        { id: "noud", name: "Noud", number: 1, present: true, roles: { dribbler: false, inbounder: true, runner: false } },
        { id: "joris", name: "Joris", number: 15, present: true, roles: { dribbler: false, inbounder: true, runner: false } },
        { id: "lucas", name: "Lucas", number: 11, present: true, roles: { dribbler: true, inbounder: false, runner: false } },
        { id: "lieuwe", name: "Lieuwe", number: 20, present: true, roles: { dribbler: true, inbounder: false, runner: false } },
        { id: "nouf", name: "Nouf", number: 22, present: true, roles: { dribbler: false, inbounder: false, runner: true } }
      ];

      const specialIds = ["guus", "lucas", "sander"];
      const periodCount = 8;
      const playersPerPeriod = 5;

      let editingPlayerId = null;
      let editingRolePlayerId = null;

      function clonePeriods(periods) {
        return (periods || []).map((period, i) => ({
          id: period.id ?? i + 1,
          selected: Array.isArray(period.selected)
            ? period.selected.slice(0, playersPerPeriod).concat(Array(playersPerPeriod).fill(null)).slice(0, playersPerPeriod)
            : Array(playersPerPeriod).fill(null)
        }));
      }

      function getDefaultState() {
        return {
          players: basePlayers.map((player) => ({ ...player, roles: { ...player.roles } })),
          periods: Array.from({ length: periodCount }, (_, i) => ({ id: i + 1, selected: Array(playersPerPeriod).fill(null) })),
          matches: [],
          templates: []
        };
      }

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem("basketballRotationState"));
          if (!saved || !Array.isArray(saved.players)) return getDefaultState();

          return {
            players: saved.players.map((p) => ({ ...p, roles: { ...(p.roles || {}) } })),
            periods: clonePeriods(Array.isArray(saved.periods) ? saved.periods : []),
            matches: Array.isArray(saved.matches) ? saved.matches : [],
            templates: Array.isArray(saved.templates) ? saved.templates : []
          };
        } catch {
          return getDefaultState();
        }
      }

      const state = loadState();
      const playersBody = document.getElementById("playersBody");
      const scheduleGrid = document.getElementById("scheduleGrid");
      const presenceSummary = document.getElementById("presenceSummary");
      const rotationSummary = document.getElementById("rotationSummary");
      const matchGrid = document.getElementById("matchGrid");
      const templateSelect = document.getElementById("templateSelect");
      const templateNameInput = document.getElementById("templateName");
      const addMatchBtn = document.getElementById("addMatchBtn");
      const addPlayerBtn = document.getElementById("addPlayerBtn");
      const saveTemplateBtn = document.getElementById("saveTemplateBtn");
      const loadTemplateBtn = document.getElementById("loadTemplateBtn");
      const deleteTemplateBtn = document.getElementById("deleteTemplateBtn");
      const playerModal = document.getElementById("playerModal");
      const playerForm = document.getElementById("playerForm");
      const closeModalBtn = document.getElementById("closeModalBtn");
      const cancelBtn = document.getElementById("cancelBtn");
      const modalTitle = document.getElementById("modalTitle");
      const roleModal = document.getElementById("roleModal");
      const roleForm = document.getElementById("roleForm");
      const closeRoleModalBtn = document.getElementById("closeRoleModalBtn");
      const cancelRoleBtn = document.getElementById("cancelRoleBtn");
      const rolePlayerName = document.getElementById("rolePlayerName");

      function saveState() {
        localStorage.setItem("basketballRotationState", JSON.stringify(state));
      }

      function getPresentPlayers() {
        return state.players.filter((player) => player.present);
      }

      function updatePresenceSummary() {
        const present = getPresentPlayers().length;
        presenceSummary.textContent = `${present} speler${present === 1 ? "" : "s"} aanwezig`;
      }

      function playerById(playerId) {
        return state.players.find((player) => player.id === playerId);
      }

      function getRoleBadge(playerId) {
        const player = playerById(playerId);
        if (!player) return "neutral";
        const p = player.roles;

        if (p.dribbler) return "dribbler";
        if (p.inbounder) return "inbounder";
        if (p.runner) return "runner";
        return "neutral";
      }

      function getRoleBadgeLabel(badge) {
        return badge === "dribbler" ? "D" : badge === "inbounder" ? "I" : badge === "runner" ? "R" : "N";
      }

      function renderPlayers() {
        playersBody.innerHTML = state.players.map((player) => `
          <tr data-player-id="${player.id}">
            <td><input type="checkbox" class="present-toggle" data-player-id="${player.id}" ${player.present ? "checked" : ""} /></td>
            <td><input type="text" class="player-name" data-player-id="${player.id}" value="${player.name}" /></td>
            <td><input type="number" class="player-number" data-player-id="${player.id}" value="${player.number}" min="0" max="99" /></td>
            <td><input type="checkbox" class="role-toggle" data-player-id="${player.id}" data-role="dribbler" ${player.roles.dribbler ? "checked" : ""} /></td>
            <td><input type="checkbox" class="role-toggle" data-player-id="${player.id}" data-role="inbounder" ${player.roles.inbounder ? "checked" : ""} /></td>
            <td><input type="checkbox" class="role-toggle" data-player-id="${player.id}" data-role="runner" ${player.roles.runner ? "checked" : ""} /></td>
          </tr>
        `).join("");

        updatePresenceSummary();
      }

      function getPlayerRotationCount(playerId) {
        return state.periods.reduce((count, period) => count + (period.selected.includes(playerId) ? 1 : 0), 0);
      }

      function renderRotationSummary() {
        const presentPlayers = getPresentPlayers();
        if (!presentPlayers.length) {
          rotationSummary.innerHTML = "";
          return;
        }

        const target = Math.round((periodCount * playersPerPeriod) / presentPlayers.length);

        rotationSummary.innerHTML = presentPlayers.map((player) => {
          const count = getPlayerRotationCount(player.id);
          return `
            <div class="stat-pill">
              <span>${player.name}</span>
              <span class="count">${count}/${target}</span>
            </div>
          `;
        }).join("");
      }

      function getCounts(period) {
        const players = period.selected.map((id) => playerById(id)).filter(Boolean);
        return {
          dribbler: players.filter((p) => p.roles.dribbler).length,
          inbounder: players.filter((p) => p.roles.inbounder).length,
          runner: players.filter((p) => p.roles.runner).length,
          total: players.length,
          special: players.filter((p) => specialIds.includes(p.id)).length
        };
      }

      function isValidPeriod(period) {
        const counts = getCounts(period);
        return counts.total === 5 && counts.dribbler === 2 && counts.runner === 2 && counts.inbounder === 1 && counts.special <= 2;
      }

      function renderSchedule() {
        scheduleGrid.innerHTML = state.periods.map((period, index) => {
          const counts = getCounts(period);
          const valid = isValidPeriod(period);

          const slots = Array.from({ length: playersPerPeriod }, (_, slotIndex) => {
            const selectedId = period.selected[slotIndex];
            const player = playerById(selectedId);
            const badge = player ? getRoleBadge(selectedId) : "neutral";

            return `
              <div class="slot-row">
                <select data-period-id="${period.id}" data-slot-index="${slotIndex}" class="slot-select">
                  <option value="">Leeg</option>
                  ${getPresentPlayers().map((p) => `
                    <option value="${p.id}" ${p.id === selectedId ? "selected" : ""}>${p.name}</option>
                  `).join("")}
                </select>

                <button class="slot-toggle ${selectedId ? "active" : ""}" data-period-id="${period.id}" data-slot-index="${slotIndex}" data-player-id="${selectedId || ""}" title="${selectedId ? "Verwijderen" : "Toevoegen"}">
                  ${selectedId ? "✓" : "+"}
                </button>
              </div>

              <div class="slot-name">
                ${player ? player.name : "Leeg"}
              </div>
              ${player ? `<div class="badge-row"><span class="role-badge ${badge}" data-player-id="${selectedId}">${getRoleBadgeLabel(badge)}</span></div>` : ""}
            `;
          }).join("");

          return `
            <article class="period-card ${valid ? "" : "invalid"}">
              <div class="period-head">
                <h3>Periode ${index + 1}</h3>
                <span class="role-badge dribbler">${counts.total}/5</span>
              </div>
              ${slots}
              <div class="badge-row">
                <span class="role-badge dribbler">D ${counts.dribbler}</span>
                <span class="role-badge inbounder">I ${counts.inbounder}</span>
                <span class="role-badge runner">R ${counts.runner}</span>
              </div>
              <div class="status ${valid ? "ok" : "warn"}">
                <span>status</span>
                <strong>${valid ? "OK" : "WAAR"}</strong>
              </div>
            </article>
          `;
        }).join("");

        document.querySelectorAll(".slot-toggle").forEach((btn) => {
          btn.addEventListener("click", () => {
            const periodId = Number(btn.dataset.periodId);
            const slotIndex = Number(btn.dataset.slotIndex);
            const period = state.periods.find((p) => p.id === periodId);
            if (!period) return;

            if (btn.dataset.playerId) {
              period.selected[slotIndex] = null;
            }

            saveState();
            renderSchedule();
            renderRotationSummary();
          });
        });

        document.querySelectorAll(".role-badge[data-player-id]").forEach((badge) => {
          badge.addEventListener("click", () => {
            const playerId = badge.dataset.playerId;
            const player = playerById(playerId);
            if (!player) return;
            openRoleModal(playerId);
          });
        });
      }

      function renderMatches() {
        matchGrid.innerHTML = state.matches.map((match, index) => {
          const date = new Date(match.date);
          const label = isNaN(date.getTime()) ? match.date : date.toLocaleDateString("nl-NL", { weekday: "short", day: "numeric", month: "short", year: "numeric" });

          return `
            <div class="match-card">
              <div class="match-info">
                <h3>${match.opponent}</h3>
                <p>${label}</p>
              </div>
              <div class="match-actions">
                <button class="secondary" data-index="${index}" id="loadMatchBtn">Laad</button>
                <button class="secondary" data-index="${index}" id="deleteMatchBtn">X</button>
              </div>
            </div>
          `;
        }).join("");

        document.querySelectorAll("#loadMatchBtn").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            const index = Number(e.currentTarget.dataset.index);
            const match = state.matches[index];
            if (!match) return;

            state.periods = clonePeriods(match.periods || []);
            saveState();
            render();
          });
        });

        document.querySelectorAll("#deleteMatchBtn").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            const index = Number(e.currentTarget.dataset.index);
            state.matches.splice(index, 1);
            saveState();
            renderMatches();
          });
        });
      }

      function renderTemplates() {
        templateSelect.innerHTML = '<option value="">Geen template</option>' +
          state.templates.map((template) => `
            <option value="${template.id}">${template.name}</option>
          `).join("");
      }

      function addMatch() {
        const date = document.getElementById("matchDate").value;
        const opponent = document.getElementById("matchOpponent").value.trim();

        if (!date || !opponent) {
          alert("Vul datum en tegenstander in.");
          return;
        }

        state.matches.push({
          date,
          opponent,
          periods: clonePeriods(state.periods)
        });

        saveState();
        renderMatches();
        document.getElementById("matchDate").value = "";
        document.getElementById("matchOpponent").value = "";
      }

      function saveCurrentTemplate() {
        const name = templateNameInput.value.trim();
        if (!name) {
          alert("Vul een template naam in.");
          return;
        }

        const existing = state.templates.find((template) => template.name.toLowerCase() === name.toLowerCase());
        if (existing) {
          existing.periods = clonePeriods(state.periods);
          saveState();
          renderTemplates();
          templateNameInput.value = "";
          return;
        }

        state.templates.push({
          id: Date.now().toString(),
          name,
          periods: clonePeriods(state.periods)
        });

        saveState();
        renderTemplates();
        templateNameInput.value = "";
      }

      function loadSelectedTemplate() {
        const selectedId = templateSelect.value;
        if (!selectedId) {
          alert("Kies eerst een template.");
          return;
        }

        const template = state.templates.find((item) => item.id === selectedId);
        if (!template) return;

        state.periods = clonePeriods(template.periods || []);
        saveState();
        render();
      }

      function deleteSelectedTemplate() {
        const selectedId = templateSelect.value;
        if (!selectedId) {
          alert("Kies eerst een template om te verwijderen.");
          return;
        }

        state.templates = state.templates.filter((item) => item.id !== selectedId);
        saveState();
        renderTemplates();
      }

      function openPlayerModal(playerId = null) {
        editingPlayerId = playerId;

        if (playerId) {
          const player = playerById(playerId);
          if (!player) return;

          modalTitle.textContent = "Speler Bewerken";
          document.getElementById("playerNameInput").value = player.name;
          document.getElementById("playerNumberInput").value = player.number;
          document.getElementById("roleDribbler").checked = player.roles.dribbler;
          document.getElementById("roleInbounder").checked = player.roles.inbounder;
          document.getElementById("roleRunner").checked = player.roles.runner;
        } else {
          modalTitle.textContent = "Speler Toevoegen";
          playerForm.reset();
          document.getElementById("roleDribbler").checked = false;
          document.getElementById("roleInbounder").checked = false;
          document.getElementById("roleRunner").checked = true;
        }

        playerModal.classList.add("show");
      }

      function closePlayerModal() {
        playerModal.classList.remove("show");
        editingPlayerId = null;
      }

      function openRoleModal(playerId) {
        editingRolePlayerId = playerId;
        const player = playerById(playerId);
        if (!player) return;

        rolePlayerName.textContent = player.name;
        document.getElementById("schemaRoleDribbler").checked = player.roles.dribbler;
        document.getElementById("schemaRoleInbounder").checked = player.roles.inbounder;
        document.getElementById("schemaRoleRunner").checked = player.roles.runner;

        roleModal.classList.add("show");
      }

      function closeRoleModal() {
        roleModal.classList.remove("show");
        editingRolePlayerId = null;
      }

      function savePlayer(e) {
        e.preventDefault();

        const name = document.getElementById("playerNameInput").value.trim();
        if (!name) {
          alert("Voer een naam in");
          return;
        }

        const number = Number(document.getElementById("playerNumberInput").value) || 0;
        const roles = {
          dribbler: document.getElementById("roleDribbler").checked,
          inbounder: document.getElementById("roleInbounder").checked,
          runner: document.getElementById("roleRunner").checked
        };

        if (editingPlayerId) {
          const player = playerById(editingPlayerId);
          if (player) {
            player.name = name;
            player.number = number;
            player.roles = roles;
          }
        } else {
          const newId = "player_" + Date.now();
          state.players.push({
            id: newId,
            name,
            number,
            present: true,
            roles
          });
        }

        saveState();
        closePlayerModal();
        render();
      }

      function saveRoles(e) {
        e.preventDefault();

        if (!editingRolePlayerId) return;

        const player = playerById(editingRolePlayerId);
        if (!player) return;

        player.roles = {
          dribbler: document.getElementById("schemaRoleDribbler").checked,
          inbounder: document.getElementById("schemaRoleInbounder").checked,
          runner: document.getElementById("schemaRoleRunner").checked
        };

        saveState();
        closeRoleModal();
        renderSchedule();
        renderRotationSummary();
      }

      function getRoleCounts(players) {
        return players.reduce((acc, player) => {
          if (player.roles.dribbler) acc.dribbler += 1;
          if (player.roles.inbounder) acc.inbounder += 1;
          if (player.roles.runner) acc.runner += 1;
          if (specialIds.includes(player.id)) acc.special += 1;
          return acc;
        }, { dribbler: 0, inbounder: 0, runner: 0, special: 0 });
      }

      function isValidCombo(combo) {
        const counts = getRoleCounts(combo);
        return counts.dribbler >= 1 && counts.inbounder >= 1 && counts.runner >= 1 && counts.special <= 2;
      }

      function combinations(arr, size) {
        if (!size) return [[]];
        if (!arr.length) return [];
        const [first, ...rest] = arr;
        const withFirst = combinations(rest, size - 1).map((combo) => [first, ...combo]);
        const withoutFirst = combinations(rest, size);
        return [...withFirst, ...withoutFirst];
      }

      function generateFairRotation() {
        const present = getPresentPlayers();
        if (present.length < playersPerPeriod) {
          alert(`Niet genoeg spelers aanwezig (${playersPerPeriod} nodig).`);
          return null;
        }

        const validCombos = combinations(present, playersPerPeriod).filter(isValidCombo);

        if (!validCombos.length) {
          const fallback = [];
          const shuffled = [...present].sort(() => Math.random() - 0.5);
          for (let i = 0; i < periodCount; i++) {
            const group = [];
            for (let j = 0; j < playersPerPeriod; j++) {
              const player = shuffled[(i * playersPerPeriod + j) % shuffled.length];
              group.push(player);
            }
            fallback.push(group);
          }
          return fallback.map((period) => period.map((player) => player ? player.id : null));
        }

        const targetPerPlayer = (periodCount * playersPerPeriod) / present.length;
        const usage = Object.fromEntries(present.map((p) => [p.id, 0]));
        const selected = [];

        for (let i = 0; i < periodCount; i++) {
          let best = null;
          let bestScore = Number.POSITIVE_INFINITY;

          validCombos.forEach((combo) => {
            const comboKey = combo.map((p) => p.id).sort().join("|");
            const alreadyUsed = selected.some((periodCombo) => periodCombo.sort().join("|") === comboKey);

            let score = 0;
            combo.forEach((player) => {
              const deficit = targetPerPlayer - usage[player.id];
              score += deficit > 0 ? -deficit * 100 : Math.abs(deficit) * 200;
            });
            if (alreadyUsed) score += 9999;

            if (score < bestScore) {
              bestScore = score;
              best = combo;
            }
          });

          if (!best) return null;

          selected.push(best.map((p) => p.id));
          best.forEach((player) => usage[player.id] += 1);
        }

        return selected;
      }

      function generateAllPeriods() {
        const generated = generateFairRotation();
        if (!generated) return;

        state.periods = generated.map((ids, index) => ({
          id: index + 1,
          selected: ids
        }));

        saveState();
        renderSchedule();
        renderRotationSummary();
      }

      function resetState() {
        const ok = window.confirm("Reset alles?");
        if (!ok) return;

        const fresh = getDefaultState();
        state.players = fresh.players;
        state.periods = fresh.periods;
        state.matches = fresh.matches;
        state.templates = fresh.templates;
        saveState();
        render();
      }

      function render() {
        renderPlayers();
        renderSchedule();
        renderRotationSummary();
        renderMatches();
        renderTemplates();
      }

      document.querySelectorAll(".collapse-btn").forEach((btn) => {
        btn.addEventListener("click", () => {
          const panelId = btn.dataset.panel + "Panel";
          const panel = document.getElementById(panelId);
          const isCollapsed = panel.classList.contains("collapsed");

          panel.classList.toggle("collapsed");
          btn.textContent = isCollapsed ? "−" : "+";
        });
      });

      document.getElementById("generateBtn").addEventListener("click", generateAllPeriods);
      document.getElementById("resetBtn").addEventListener("click", resetState);
      document.getElementById("printBtn").addEventListener("click", () => window.print());
      addMatchBtn.addEventListener("click", addMatch);
      addPlayerBtn.addEventListener("click", () => openPlayerModal());
      saveTemplateBtn.addEventListener("click", saveCurrentTemplate);
      loadTemplateBtn.addEventListener("click", loadSelectedTemplate);
      deleteTemplateBtn.addEventListener("click", deleteSelectedTemplate);

      playerForm.addEventListener("submit", savePlayer);
      roleForm.addEventListener("submit", saveRoles);
      closeModalBtn.addEventListener("click", closePlayerModal);
      cancelBtn.addEventListener("click", closePlayerModal);
      closeRoleModalBtn.addEventListener("click", closeRoleModal);
      cancelRoleBtn.addEventListener("click", closeRoleModal);

      playerModal.addEventListener("click", (e) => {
        if (e.target === playerModal) closePlayerModal();
      });

      roleModal.addEventListener("click", (e) => {
        if (e.target === roleModal) closeRoleModal();
      });

      document.addEventListener("change", (event) => {
        if (event.target.matches(".present-toggle")) {
          const player = playerById(event.target.dataset.playerId);
          if (!player) return;
          player.present = event.target.checked;
          saveState();
          render();
          return;
        }

        if (event.target.matches(".player-name")) {
          const player = playerById(event.target.dataset.playerId);
          if (!player) return;
          player.name = event.target.value || "Nieuwe speler";
          saveState();
          renderSchedule();
          renderRotationSummary();
          return;
        }

        if (event.target.matches(".player-number")) {
          const player = playerById(event.target.dataset.playerId);
          if (!player) return;
          player.number = Number(event.target.value) || 0;
          saveState();
          renderSchedule();
          return;
        }

        if (event.target.matches(".role-toggle")) {
          const player = playerById(event.target.dataset.playerId);
          if (!player) return;
          const role = event.target.dataset.role;
          player.roles[role] = event.target.checked;
          saveState();
          renderSchedule();
          renderRotationSummary();
          return;
        }

        if (event.target.matches(".slot-select")) {
          const periodId = Number(event.target.dataset.periodId);
          const slotIndex = Number(event.target.dataset.slotIndex);
          const period = state.periods.find((p) => p.id === periodId);
          if (!period) return;

          period.selected[slotIndex] = event.target.value || null;
          saveState();
          renderSchedule();
          renderRotationSummary();
        }
      });

      render();
    </script>
  </body>
</html>
