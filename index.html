<!DOCTYPE html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Basketbal Rotatie Schema</title>
    <style>
      :root {
        --bg: #111827;
        --panel: #1f2937;
        --panel-2: #0f172a;
        --tile: #e5e7eb;
        --line: rgba(255,255,255,0.1);
        --text: #f3f4f6;
        --muted: #cbd5e1;
        --red: #b7191f;
        --red-dark: #8b1117;
        --dribbler: #f59e0b;
        --inbounder: #3b82f6;
        --runner: #10b981;
        --multi: #8b5cf6;
        --ok: #34d399;
        --warn: #fbbf24;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--text);
      }

      body {
        min-height: 100vh;
        padding: 18px;
      }

      .page-shell {
        max-width: 1400px;
        margin: 0 auto;
      }

      .topbar {
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 16px;
        background: rgba(17,24,39,0.9);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 18px 20px;
        margin-bottom: 20px;
      }

      h1 {
        margin: 0;
        font-size: clamp(1.8rem, 2vw, 2.8rem);
        color: #f8fafc;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      button {
        border: none;
        border-radius: 10px;
        padding: 10px 14px;
        font-weight: 700;
        cursor: pointer;
      }

      .primary {
        background: var(--red);
        color: white;
      }

      .secondary {
        background: #374151;
        color: var(--text);
      }

      .players-panel, .schedule-panel, .match-panel {
        background: rgba(31,41,55,0.9);
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 16px;
        margin-bottom: 22px;
      }

      .panel-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 14px;
      }

      .panel-header h2 {
        margin: 0;
        font-size: 1.1rem;
        color: white;
      }

      .summary-pill {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 12px;
        color: var(--muted);
        font-size: 0.85rem;
      }

      .players-layout {
        display: grid;
        grid-template-columns: 420px 1fr;
        gap: 24px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
      }

      thead th {
        background: rgba(255,255,255,0.04);
        color: var(--muted);
        padding: 10px 8px;
        border-bottom: 1px solid var(--line);
        text-align: center;
      }

      thead th:nth-child(2) {
        text-align: left;
      }

      tbody td {
        padding: 8px 8px;
        border-bottom: 1px solid rgba(255,255,255,0.06);
        text-align: center;
      }

      tbody td:nth-child(2) {
        text-align: left;
      }

      input[type="text"], input[type="number"], input[type="date"], select {
        width: 100%;
        background: #0f172a;
        color: white;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
        font: inherit;
      }

      input[type="checkbox"] {
        accent-color: var(--red);
        width: 18px;
        height: 18px;
      }

      .rotation-summary {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-top: 16px;
      }

      .stat-pill {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 7px 10px;
        color: var(--text);
        font-size: 0.82rem;
      }

      .stat-pill .count {
        min-width: 36px;
        text-align: center;
        padding: 3px 7px;
        border-radius: 999px;
        background: var(--red);
        color: white;
        font-weight: bold;
      }

      .schedule-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        gap: 16px;
      }

      .period-card {
        background: rgba(15, 23, 42, 0.9);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 12px;
      }

      .period-card.invalid {
        border-color: rgba(251, 191, 36, 0.8);
      }

      .period-head {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 10px;
      }

      .period-head h3 {
        margin: 0;
        font-size: 1rem;
      }

      .slot-row {
        display: grid;
        grid-template-columns: 1fr 38px;
        gap: 8px;
        margin-bottom: 8px;
      }

      .slot-row select {
        background: rgba(255,255,255,0.04);
        color: white;
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 8px 10px;
      }

      .slot-toggle {
        border: 1px solid var(--line);
        border-radius: 8px;
        background: rgba(255,255,255,0.04);
        color: white;
        font-size: 1rem;
        padding: 0;
        width: 38px;
        height: 38px;
      }

      .slot-toggle.active {
        background: var(--red);
        border-color: var(--red);
      }

      .badge-row {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-top: 8px;
      }

      .role-badge {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-width: 32px;
        padding: 5px 8px;
        border-radius: 999px;
        color: white;
        font-size: 0.72rem;
        font-weight: 700;
      }

      .role-badge.dribbler { background: var(--dribbler); }
      .role-badge.inbounder { background: var(--inbounder); }
      .role-badge.runner { background: var(--runner); }
      .role-badge.multi { background: var(--multi); }
      .role-badge.neutral { background: #6b7280; }

      .status {
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px solid var(--line);
        display: flex;
        justify-content: space-between;
        font-size: 0.8rem;
        color: var(--muted);
      }

      .status.ok { color: var(--ok); }
      .status.warn { color: var(--warn); }

      .match-form {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 12px;
        align-items: end;
        margin-bottom: 18px;
      }

      .form-group {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }

      .form-group label {
        font-size: 0.84rem;
        color: var(--muted);
      }

      .match-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
        gap: 16px;
      }

      .match-card {
        background: rgba(255,255,255,0.04);
        border: 1px solid var(--line);
        border-left: 6px solid var(--red);
        border-radius: 12px;
        padding: 12px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
      }

      .match-info h3 {
        margin: 0 0 4px;
      }

      .match-info p {
        margin: 0;
        color: var(--muted);
        font-size: 0.82rem;
      }

      .match-actions {
        display: flex;
        gap: 8px;
      }

      .match-actions button {
        padding: 6px 10px;
        font-size: 0.8rem;
      }

      @media (max-width: 900px) {
        .players-layout {
          grid-template-columns: 1fr;
        }
      }

      @media (max-width: 700px) {
        .topbar {
          flex-direction: column;
          align-items: flex-start;
        }
        .actions {
          width: 100%;
        }
        .actions button {
          flex: 1 1 140px;
        }
      }
    </style>
  </head>
  <body>
    <div class="page-shell">
      <header class="topbar">
        <h1>Basketbal Rotatie Schema</h1>
        <div class="actions">
          <button class="primary" id="generateBtn">Genereer</button>
          <button class="secondary" id="resetBtn">Reset</button>
          <button class="secondary" id="printBtn">Print</button>
        </div>
      </header>

      <section class="match-panel">
        <div class="panel-header">
          <h2>Wedstrijden</h2>
        </div>

        <div class="match-form">
          <div class="form-group">
            <label>Datum</label>
            <input type="date" id="matchDate" />
          </div>
          <div class="form-group">
            <label>Tegenstander</label>
            <input type="text" id="matchOpponent" placeholder="Tegenstander" />
          </div>
          <button class="primary" id="addMatchBtn">Toevoegen</button>
        </div>

        <div class="match-grid" id="matchGrid"></div>
      </section>

      <section class="players-panel">
        <div class="panel-header">
          <h2>Spelers</h2>
          <div class="summary-pill" id="presenceSummary">0 spelers aanwezig</div>
        </div>

        <div class="players-layout">
          <div>
            <table>
              <thead>
                <tr>
                  <th>Speelt</th>
                  <th>Naam</th>
                  <th>Nr.</th>
                  <th>D</th>
                  <th>I</th>
                  <th>R</th>
                </tr>
              </thead>
              <tbody id="playersBody"></tbody>
            </table>
          </div>

          <div>
            <div class="rotation-summary" id="rotationSummary"></div>
          </div>
        </div>
      </section>

      <section class="schedule-panel">
        <div class="panel-header">
          <h2>Roulatieschema</h2>
        </div>
        <div class="schedule-grid" id="scheduleGrid"></div>
      </section>
    </div>

    <script>
      const basePlayers = [
        { id: "guus", name: "Guus", number: 10, present: true, roles: { dribbler: false, inbounder: false, runner: true } },
        { id: "tanne", name: "Tanne", number: 16, present: true, roles: { dribbler: false, inbounder: true, runner: true } },
        { id: "noah", name: "Noah", number: 30, present: true, roles: { dribbler: true, inbounder: true, runner: true } },
        { id: "vuk", name: "Vuk", number: 55, present: true, roles: { dribbler: false, inbounder: true, runner: true } },
        { id: "sander", name: "Sander", number: 27, present: true, roles: { dribbler: true, inbounder: false, runner: true } },
        { id: "duuk", name: "Duuk", number: 13, present: true, roles: { dribbler: false, inbounder: false, runner: true } },
        { id: "tygo", name: "Tygo", number: 14, present: true, roles: { dribbler: true, inbounder: true, runner: true } },
        { id: "noud", name: "Noud", number: 1, present: true, roles: { dribbler: false, inbounder: true, runner: true } },
        { id: "joris", name: "Joris", number: 15, present: true, roles: { dribbler: false, inbounder: true, runner: true } },
        { id: "lucas", name: "Lucas", number: 11, present: true, roles: { dribbler: true, inbounder: false, runner: true } },
        { id: "lieuwe", name: "Lieuwe", number: 20, present: true, roles: { dribbler: true, inbounder: true, runner: true } },
        { id: "nouf", name: "Nouf", number: 22, present: true, roles: { dribbler: false, inbounder: false, runner: true } }
      ];

      const specialIds = ["guus", "lucas", "sander", "niels"];
      const periodCount = 8;
      const playersPerPeriod = 5;

      function getDefaultState() {
        return {
          players: basePlayers.map((player) => ({ ...player, roles: { ...player.roles } })),
          periods: Array.from({ length: periodCount }, (_, i) => ({ id: i + 1, selected: Array(playersPerPeriod).fill(null) })),
          matches: []
        };
      }

      function loadState() {
        try {
          const saved = JSON.parse(localStorage.getItem("basketballRotationState"));
          if (!saved || !Array.isArray(saved.players)) return getDefaultState();

          const players = saved.players.map((p) => ({ ...p, roles: { ...(p.roles || {}) } }));
          const periods = Array.isArray(saved.periods) && saved.periods.length === periodCount
            ? saved.periods.map((period, idx) => ({
                id: idx + 1,
                selected: Array.isArray(period.selected)
                  ? period.selected.slice(0, playersPerPeriod).concat(Array(playersPerPeriod).fill(null)).slice(0, playersPerPeriod)
                  : Array(playersPerPeriod).fill(null)
              }))
            : Array.from({ length: periodCount }, (_, i) => ({ id: i + 1, selected: Array(playersPerPeriod).fill(null) }));

          return { players, periods, matches: Array.isArray(saved.matches) ? saved.matches : [] };
        } catch {
          return getDefaultState();
        }
      }

      const state = loadState();
      const playersBody = document.getElementById("playersBody");
      const scheduleGrid = document.getElementById("scheduleGrid");
      const presenceSummary = document.getElementById("presenceSummary");
      const rotationSummary = document.getElementById("rotationSummary");
      const matchGrid = document.getElementById("matchGrid");
      const addMatchBtn = document.getElementById("addMatchBtn");

      function saveState() {
        localStorage.setItem("basketballRotationState", JSON.stringify(state));
      }

      function getPresentPlayers() {
        return state.players.filter((player) => player.present);
      }

      function updatePresenceSummary() {
        const present = getPresentPlayers().length;
        presenceSummary.textContent = `${present} speler${present === 1 ? "" : "s"} aanwezig`;
      }

      function playerById(playerId) {
        return state.players.find((player) => player.id === playerId);
      }

      function getRoleBadge(playerId, periodId) {
        const player = playerById(playerId);
        if (!player) return "neutral";
        const p = player.roles;
        if (p.dribbler && p.inbounder && p.runner) return "multi";
        if (p.dribbler && p.inbounder) return "multi";
        if (p.dribbler && p.runner) return "multi";
        if (p.inbounder && p.runner) return "multi";
        if (p.dribbler) return "dribbler";
        if (p.inbounder) return "inbounder";
        if (p.runner) return "runner";
        return "neutral";
      }

      function renderPlayers() {
        playersBody.innerHTML = state.players.map((player) => `
          <tr data-player-id="${player.id}">
            <td><input type="checkbox" class="present-toggle" data-player-id="${player.id}" ${player.present ? "checked" : ""} /></td>
            <td><input type="text" class="player-name" data-player-id="${player.id}" value="${player.name}" /></td>
            <td><input type="number" class="player-number" data-player-id="${player.id}" value="${player.number}" min="0" max="99" /></td>
            <td><input type="checkbox" class="role-toggle" data-player-id="${player.id}" data-role="dribbler" ${player.roles.dribbler ? "checked" : ""} /></td>
            <td><input type="checkbox" class="role-toggle" data-player-id="${player.id}" data-role="inbounder" ${player.roles.inbounder ? "checked" : ""} /></td>
            <td><input type="checkbox" class="role-toggle" data-player-id="${player.id}" data-role="runner" ${player.roles.runner ? "checked" : ""} /></td>
          </tr>
        `).join("");

        updatePresenceSummary();
      }

      function getPlayerRotationCount(playerId) {
        return state.periods.reduce((count, period) => count + (period.selected.includes(playerId) ? 1 : 0), 0);
      }

      function renderRotationSummary() {
        const presentPlayers = getPresentPlayers();
        const target = Math.round((periodCount * playersPerPeriod) / presentPlayers.length);

        rotationSummary.innerHTML = presentPlayers.map((player) => {
          const count = getPlayerRotationCount(player.id);
          return `
            <div class="stat-pill">
              <span>${player.name}</span>
              <span class="count">${count}/${target}</span>
            </div>
          `;
        }).join("");
      }

      function getCounts(period) {
        const players = period.selected.map((id) => playerById(id)).filter(Boolean);
        return {
          dribbler: players.filter((p) => p.roles.dribbler).length,
          inbounder: players.filter((p) => p.roles.inbounder).length,
          runner: players.filter((p) => p.roles.runner).length,
          total: players.length,
          special: players.filter((p) => specialIds.includes(p.id)).length
        };
      }

      function isValidPeriod(period) {
        const counts = getCounts(period);
        return counts.total === 5 && counts.dribbler === 2 && counts.runner === 2 && counts.inbounder === 1 && counts.special <= 2;
      }

      function renderSchedule() {
        scheduleGrid.innerHTML = state.periods.map((period, index) => {
          const counts = getCounts(period);
          const valid = isValidPeriod(period);

          const slots = Array.from({ length: playersPerPeriod }, (_, slotIndex) => {
            const selectedId = period.selected[slotIndex];
            const player = playerById(selectedId);
            const badge = player ? getRoleBadge(selectedId, period.id) : "neutral";

            return `
              <div class="slot-row">
                <select data-period-id="${period.id}" data-slot-index="${slotIndex}" class="slot-select">
                  <option value="">Leeg</option>
                  ${getPresentPlayers().map((p) => `
                    <option value="${p.id}" ${p.id === selectedId ? "selected" : ""}>${p.name}</option>
                  `).join("")}
                </select>

                <button class="slot-toggle ${selectedId ? "active" : ""}" data-period-id="${period.id}" data-slot-index="${slotIndex}" data-player-id="${selectedId || ""}" title="${selectedId ? "Verwijderen" : "Toevoegen"}">
                  ${selectedId ? "✓" : "+"}
                </button>
              </div>
              ${player ? `<div class="badge-row"><span class="role-badge ${badge}">${badge === "dribbler" ? "D" : badge === "inbounder" ? "I" : badge === "runner" ? "R" : badge === "multi" ? "M" : "N"}</span></div>` : ""}
            `;
          }).join("");

          return `
            <article class="period-card ${valid ? "" : "invalid"}">
              <div class="period-head">
                <h3>Periode ${index + 1}</h3>
                <span class="role-badge dribbler">${counts.total}/5</span>
              </div>
              ${slots}
              <div class="badge-row">
                <span class="role-badge dribbler">D ${counts.dribbler}</span>
                <span class="role-badge inbounder">I ${counts.inbounder}</span>
                <span class="role-badge runner">R ${counts.runner}</span>
              </div>
              <div class="status ${valid ? "ok" : "warn"}">
                <span>status</span>
                <strong>${valid ? "OK" : "WAAR"}</strong>
              </div>
            </article>
          `;
        }).join("");

        document.querySelectorAll(".slot-toggle").forEach((btn) => {
          btn.addEventListener("click", () => {
            const periodId = Number(btn.dataset.periodId);
            const slotIndex = Number(btn.dataset.slotIndex);
            const period = state.periods.find((p) => p.id === periodId);
            if (!period) return;

            if (btn.dataset.playerId) {
              period.selected[slotIndex] = null;
            }

            saveState();
            renderSchedule();
            renderRotationSummary();
          });
        });
      }

      function renderMatches() {
        matchGrid.innerHTML = state.matches.map((match, index) => {
          const date = new Date(match.date);
          const label = isNaN(date.getTime()) ? match.date : date.toLocaleDateString("nl-NL", { weekday: "short", day: "numeric", month: "short", year: "numeric" });
          return `
            <div class="match-card">
              <div class="match-info">
                <h3>${match.opponent}</h3>
                <p>${label}</p>
              </div>
              <div class="match-actions">
                <button class="secondary" data-index="${index}" id="loadMatchBtn">Laad</button>
                <button class="secondary" data-index="${index}" id="deleteMatchBtn">X</button>
              </div>
            </div>
          `;
        }).join("");

        document.querySelectorAll("#loadMatchBtn").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            const index = Number(e.target.dataset.index);
            const match = state.matches[index];
            if (!match) return;
            state.periods = match.periods.map((p) => ({ ...p, selected: [...p.selected] }));
            saveState();
            renderSchedule();
          });
        });

        document.querySelectorAll("#deleteMatchBtn").forEach((btn) => {
          btn.addEventListener("click", (e) => {
            const index = Number(e.target.dataset.index);
            state.matches.splice(index, 1);
            saveState();
            renderMatches();
          });
        });
      }

      function addMatch() {
        const date = document.getElementById("matchDate").value;
        const opponent = document.getElementById("matchOpponent").value.trim();

        if (!date || !opponent) {
          alert("Vul datum en tegenstander in.");
          return;
        }

        state.matches.push({
          date,
          opponent,
          periods: state.periods.map((p) => ({ ...p, selected: [...p.selected] }))
        });

        saveState();
        renderMatches();
        document.getElementById("matchDate").value = "";
        document.getElementById("matchOpponent").value = "";
      }

      function combinations(arr, size) {
        if (!size) return [[]];
        if (!arr.length) return [];
        const [first, ...rest] = arr;
        const withFirst = combinations(rest, size - 1).map((combo) => [first, ...combo]);
        const withoutFirst = combinations(rest, size);
        return [...withFirst, ...withoutFirst];
      }

      function isValidCombo(combo) {
        const counts = { dribbler: 0, inbounder: 0, runner: 0, special: 0 };
        combo.forEach((player) => {
          if (player.roles.dribbler) counts.dribbler += 1;
          if (player.roles.inbounder) counts.inbounder += 1;
          if (player.roles.runner) counts.runner += 1;
          if (specialIds.includes(player.id)) counts.special += 1;
        });
        return counts.dribbler === 2 && counts.runner === 2 && counts.inbounder === 1 && counts.special <= 2;
      }

      function generateFairRotation() {
        const present = getPresentPlayers();
        if (present.length < playersPerPeriod) {
          alert(`Niet genoeg spelers aanwezig (${playersPerPeriod} nodig).`);
          return null;
        }

        const validCombos = combinations(present, playersPerPeriod).filter(isValidCombo);
        if (!validCombos.length) {
          alert("Geen geldige combinatie gevonden met de huidige rollen.");
          return null;
        }

        const targetPerPlayer = (periodCount * playersPerPeriod) / present.length;
        const usage = Object.fromEntries(present.map((p) => [p.id, 0]));
        const selected = [];

        for (let i = 0; i < periodCount; i++) {
          let best = null;
          let bestScore = Number.POSITIVE_INFINITY;

          validCombos.forEach((combo) => {
            const comboKey = combo.map((p) => p.id).sort().join("|");
            const alreadyUsed = selected.some((periodCombo) => periodCombo.sort().join("|") === comboKey);

            let score = 0;
            combo.forEach((player) => {
              const deficit = targetPerPlayer - usage[player.id];
              score += deficit > 0 ? -deficit * 100 : Math.abs(deficit) * 200;
            });
            if (alreadyUsed) score += 9999;

            if (score < bestScore) {
              bestScore = score;
              best = combo;
            }
          });

          if (!best) return null;
          selected.push(best.map((p) => p.id));
          best.forEach((player) => usage[player.id] += 1);
        }

        return selected;
      }

      function generateAllPeriods() {
        const generated = generateFairRotation();
        if (!generated) return;
        state.periods = generated.map((ids, index) => ({
          id: index + 1,
          selected: ids
        }));
        saveState();
        renderSchedule();
        renderRotationSummary();
      }

      function resetState() {
        const ok = window.confirm("Reset alles?");
        if (!ok) return;
        const fresh = getDefaultState();
        state.players = fresh.players;
        state.periods = fresh.periods;
        state.matches = fresh.matches;
        saveState();
        render();
      }

      function render() {
        renderPlayers();
        renderSchedule();
        renderRotationSummary();
        renderMatches();
      }

      document.getElementById("generateBtn").addEventListener("click", generateAllPeriods);
      document.getElementById("resetBtn").addEventListener("click", resetState);
      document.getElementById("printBtn").addEventListener("click", () => window.print());
      addMatchBtn.addEventListener("click", addMatch);

      document.addEventListener("change", (event) => {
        if (event.target.matches(".present-toggle")) {
          const player = playerById(event.target.dataset.playerId);
          if (!player) return;
          player.present = event.target.checked;
          saveState();
          render();
          return;
        }

        if (event.target.matches(".player-name")) {
          const player = playerById(event.target.dataset.playerId);
          if (!player) return;
          player.name = event.target.value || "Nieuwe speler";
          saveState();
          renderSchedule();
          renderRotationSummary();
          return;
        }

        if (event.target.matches(".player-number")) {
          const player = playerById(event.target.dataset.playerId);
          if (!player) return;
          player.number = Number(event.target.value) || 0;
          saveState();
          renderSchedule();
          return;
        }

        if (event.target.matches(".role-toggle")) {
          const player = playerById(event.target.dataset.playerId);
          if (!player) return;
          const role = event.target.dataset.role;
          player.roles[role] = event.target.checked;
          saveState();
          renderSchedule();
          renderRotationSummary();
          return;
        }

        if (event.target.matches(".slot-select")) {
          const periodId = Number(event.target.dataset.periodId);
          const slotIndex = Number(event.target.dataset.slotIndex);
          const period = state.periods.find((p) => p.id === periodId);
          if (!period) return;
          period.selected[slotIndex] = event.target.value || null;
          saveState();
          renderSchedule();
          renderRotationSummary();
        }
      });

      render();
    </script>
  </body>
</html>
